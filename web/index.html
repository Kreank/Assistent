<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#04080f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/dabei/manifest.json">
<title>Sarvis</title>
<style>
/* Der Sarvis-Look, uebersetzt aus hud.py. Die Zahlen sind nicht neu
   gewaehlt, sondern uebernommen: Raster 660x548, Mitte bei 330/222,
   Ring 58, Kranz 176. Was dort QPainter malte, malt hier dasselbe
   Canvas -- damit es auf dem Handy nicht wie ein anderes Programm
   aussieht. */
:root{
  --grund:#04080f; --saum:rgba(4,8,16,.55);
  --schrift:#e8f1fd;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--grund);
  color:var(--schrift);font:14px/1.4 "Segoe UI",system-ui,-apple-system,sans-serif;
  overscroll-behavior:none}
body{display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* --- Kopfzeile: nur was man wirklich wissen muss ------------------- */
#kopf{display:flex;align-items:center;gap:10px;padding:10px 14px;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(232,241,253,.45);flex:0 0 auto}
#ampel{width:8px;height:8px;border-radius:50%;background:#c0392b;
  transition:background .3s}
#ampel.an{background:#7ee2a0}
#geraet{margin-left:auto;text-transform:none;letter-spacing:0}

/* --- Die Buehne ---------------------------------------------------- */
#buehne{flex:1 1 auto;position:relative;min-height:0}
#ring{position:absolute;inset:0;width:100%;height:100%;display:block}

/* Kacheln liegen ueber der Buehne und sind NICHT anklickbar.
   In hud.py steht dafuer Qt.WindowTransparentForInput, und der Grund
   dahinter ist kein technischer: "kein Klick, der an der Rueckfrage
   vorbeilaeuft". Auf einem Touchscreen ist per Vorgabe alles
   anklickbar -- diese Sicherung verschwaende also lautlos, wenn man
   sie nicht ausdruecklich wieder herstellt. Genau das tut die
   naechste Zeile. */
/* Passen mehr Kacheln, als Platz ist, wird gescrollt -- NICHT
   abgeschnitten. Gemessen mit drei Kacheln am 1280er Bildschirm: die
   dritte war unten weg, ohne dass irgendetwas darauf hindeutete. Das
   ist dieselbe Sorte Fehler wie eine gekürzte Liste, die sich für
   vollständig ausgibt.

   pointer-events bleibt für die Kacheln selbst aus (siehe unten) --
   erlaubt ist nur das Scrollen des Behälters. */
#kacheln{position:absolute;top:8px;right:8px;width:min(46vw,290px);
  display:flex;flex-direction:column;gap:8px;pointer-events:auto;
  touch-action:pan-y;max-height:calc(100% - 16px);overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
#kacheln > *{pointer-events:none;flex:0 0 auto}

/* Ein weicher Rand unten, wenn mehr Kacheln da sind als Platz.
   Ohne ihn endet die letzte sichtbare Kachel mitten in ihrer
   Ueberschrift, und das sieht nach Fehler aus statt nach "hier geht es
   weiter". mask statt eines aufgelegten Verlaufs, weil die Kacheln
   durchscheinend sind -- ein Farbverlauf darueber wuerde den Ring
   dahinter mit ausblenden. */
#kacheln{mask-image:linear-gradient(to bottom,#000 calc(100% - 22px),transparent);
  -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 22px),transparent)}
.kachel{background:rgba(8,13,20,.90);border:1px solid;border-radius:7px;
  padding:10px 12px 11px;font-size:11px;animation:auf .22s ease-out}
.kachel .strich{height:2px;margin:-10px -12px 9px;border-radius:7px 7px 0 0}
.kachel h4{margin:0 0 7px;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;opacity:.85;font-weight:600}
.kachel .gross{font-size:22px;font-weight:600;margin:0 0 6px;
  letter-spacing:-.01em}
.kachel .zeile{display:flex;justify-content:space-between;gap:10px;
  padding:2px 0;position:relative}
.kachel .zeile .balken{position:absolute;left:-6px;top:1px;bottom:1px;
  border-radius:2px;opacity:.13}
/* nth-of-type, nicht first-child: In einer Zeile MIT Balken ist das
   erste Kind das <i>, und damit traf first-child ausgerechnet die
   Zeilen nicht, um die es geht -- ihre Bezeichnung wurde nicht
   gekuerzt, sondern lief in den Betrag. */
.kachel .zeile span:nth-of-type(1){position:relative;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;opacity:.78}
.kachel .zeile span:nth-of-type(2){position:relative;white-space:nowrap}
.kachel .fuss{margin-top:7px;font-size:9px;letter-spacing:.13em;
  text-transform:uppercase;opacity:.45}
@keyframes auf{from{opacity:0;transform:translateY(-6px)}to{opacity:1}}

/* --- Die acht uebrigen Kachelformen --------------------------------
   Gemalt wird in sarvis.js, hier steht nur, was CSS besser kann als
   ein SVG: Umbruch, Ausrichtung, Kuerzen mit Auslassungspunkten.

   Eine Regel gilt fuer alles hier: NICHTS wird anklickbar. Das ist
   die Uebersetzung von Qt.WindowTransparentForInput -- "kein Klick,
   der an der Rueckfrage vorbeilaeuft". Es steht schon am #kacheln
   und an der .kachel; keine Regel hier hebt es auf. */

/* Eine gemalte Form ist so breit wie die Kachel und so hoch, wie sie
   sich selbst ausgerechnet hat -- deshalb kein height:auto. */
.kachel .bild{display:block;width:100%;height:auto;overflow:visible}

/* Die Marke unter einer gekuerzten Form. Ein stummer Schnitt sieht aus
   wie ein vollstaendiger Text. */
.kachel .marke{text-align:center;font-size:10px;padding:2px 0}

/* blasen: die Seite sagt, wer geschrieben hat. */
.kachel .blase{border-radius:6px;padding:7px;margin:0;line-height:14px;
  max-width:100%;word-break:break-word;opacity:.92}
.kachel .blase.mir{margin-left:auto}
.kachel .blasenzeit{font-size:9px;line-height:12px;padding-top:1px;opacity:.45}
.kachel .blasenzeit.mir{text-align:right}
.kachel .blase + .blase,.kachel .blasenzeit + .blase{margin-top:7px}

/* vergleich: die Zahlen bekommen, was sie brauchen, die Bezeichnung
   den Rest -- und kuerzt sich selbst. */
.kachel .vgl{opacity:.86;display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;
  column-gap:5px;align-items:center;row-gap:1px}
.kachel .vgl .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  padding:1px 0}
.kachel .vgl .z{text-align:right;white-space:nowrap}
.kachel .vgl .d span{display:inline-flex;align-items:center;gap:3px}
.kachel .vgl .k{font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  opacity:.55;padding-bottom:2px}

/* text: der Umbruch ist schon gerechnet, hier steht er nur. */
.kachel .fliess{line-height:14px;opacity:.86}
.kachel .fliess div{min-height:1px}

/* torte: nebeneinander, wenn Platz ist -- sonst untereinander.
   Die Entscheidung faellt in sarvis.js, siehe dort. */
.kachel .torte{display:flex;gap:14px;align-items:center}
.kachel .torte.hoch{flex-direction:column;gap:8px}
.kachel .torte .ring{flex:0 0 auto;width:auto;height:auto}
.kachel .legende{opacity:.88;flex:1 1 auto;min-width:0;width:100%;display:grid;
  grid-template-columns:auto minmax(0,1fr) auto auto;column-gap:4px;
  align-items:center;row-gap:2px}
.kachel .legende .leg{display:contents}
.kachel .tupf{width:7px;height:7px;border-radius:2px;display:block}
.kachel .tupf.leer{background:none;border:1px solid;border-radius:0}
.kachel .legende .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kachel .legende .wt,.kachel .legende .pz{text-align:right;white-space:nowrap}

/* kategorien: der Haarstrich unter der Ueberschrift ist das, was aus
   einer eingerueckten Liste eine gruppierte macht -- ohne ihn liest
   man die Ueberschrift als ersten Posten. */
.kachel .grkopf{display:flex;justify-content:space-between;gap:9px;
  font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  border-bottom:1px solid;padding:0 0 2px;margin:6px 0 2px}
.kachel .grkopf:first-child{margin-top:0}
.kachel .zeile.ein{margin-left:11px}

/* --- Die angebotene Seite ------------------------------------------
   DAS EINZIGE ANKLICKBARE STUECK UEBER DER BUEHNE, und deshalb sieht
   es anders aus als alles daneben: Kacheln tragen die Sprechfarben
   (orange, gruen) und sind tot; das hier traegt das Cyan der
   Bedienelemente und hat einen Knopf. Wer den Unterschied nicht
   erklaert bekommt, sieht ihn.

   Warum ueberhaupt ein Angebot und kein window.open(): Ein Popup ohne
   vorausgegangenen Klick blockiert jeder Browser, und man merkt es nur
   an einem stummen Symbol in der Adresszeile. Hier geht ein ZURUF
   voraus, kein Klick -- also muss der Klick hier entstehen. Dann geht
   die Seite immer auf, und der Nutzer hat sie selbst geoeffnet. */
#seite{position:absolute;left:14px;bottom:52px;max-width:min(70vw,430px);
  display:none;align-items:center;gap:10px;pointer-events:auto;
  background:rgba(10,17,26,.94);border:1px solid rgba(0,229,255,.38);
  border-radius:11px;padding:8px 8px 8px 12px;
  animation:auf .22s ease-out}
#seite.an{display:flex}
#seite .was{min-width:0;flex:1 1 auto}
#seite .ort{font-size:12px;font-weight:600;color:rgba(0,229,255,.92);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#seite .dazu{font-size:11px;color:rgba(232,241,253,.62);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#seite .dazu:empty{display:none}
#seite .auf{flex:0 0 auto;background:#00e5ff;color:#04080f;
  border-radius:8px;padding:8px 13px;font-size:12px;font-weight:600;
  text-decoration:none;white-space:nowrap}

/* --- Was im Hintergrund arbeitet ----------------------------------- */
#hintergrund{position:absolute;top:10px;left:14px;width:min(52vw,220px);
  font-size:10px;pointer-events:none;display:none}
#hintergrund.an{display:block}
#hintergrund .kopf{letter-spacing:.16em;text-transform:uppercase;
  opacity:.95;margin-bottom:3px;font-size:9px}
#hintergrund .zeile{opacity:.78;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;line-height:1.5}

/* --- Untertitel ----------------------------------------------------- */
#untertitel{position:absolute;left:8%;right:8%;bottom:8px;text-align:center;
  font-size:15px;font-weight:600;line-height:1.35;pointer-events:none;
  text-shadow:-1px 0 var(--saum),1px 0 var(--saum),0 -1px var(--saum),
              0 1px var(--saum),1px 1px var(--saum)}

/* --- Bedienung ------------------------------------------------------ */
#bedienung{flex:0 0 auto;padding:10px 14px calc(14px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:10px}
#reden{height:78px;border:none;border-radius:14px;color:#04080f;
  font:600 15px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.1em;
  text-transform:uppercase;background:#7ea3c8;touch-action:none;
  transition:transform .08s,background .15s;user-select:none}
#reden:disabled{opacity:.35}
#reden.haelt{transform:scale(.975);background:#00e5ff}
/* Das Mikrofon zu waehlen ist normalerweise unnoetig -- der Browser
   nimmt das Standardgeraet, und meistens stimmt das. Es steht hier,
   weil es einmal NICHT stimmte: 60 Sekunden Aufnahme kamen als Stille
   an, und ohne diese Zeile gab es keinen Weg, das von aussen zu sehen
   oder zu aendern. Deshalb klein und unaufdringlich, aber vorhanden.
   Erscheint nur, wenn es mehr als ein Geraet gibt. */
/* Der Schalter fuers Mithoeren.
   Am Rechner sinnvoll: 16 kHz int16 sind 256 kbit/s, im heimischen Netz
   ein halbes Promille. Am Handy nicht: rund 260 MB am Tag, auch wenn
   niemand redet, und das Mikrofon dauerhaft offen. Deshalb ein
   Schalter und keine Vorgabe -- und er merkt sich seine Stellung. */
#mithoeren{display:flex;align-items:center;gap:8px;font-size:12px;
  color:rgba(232,241,253,.55);user-select:none;cursor:pointer}
#mithoeren input{width:16px;height:16px;accent-color:#00e5ff;margin:0}
#mithoeren.laeuft{color:rgba(0,229,255,.85)}

#mikro{display:none;background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.10);border-radius:9px;
  color:rgba(232,241,253,.62);padding:7px 10px;font-size:12px;
  width:100%;appearance:none}
#mikro.zeigen{display:block}

#tippen{display:flex;gap:8px}
#tippen input{flex:1;min-width:0;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);border-radius:11px;
  padding:12px 14px;color:var(--schrift);font-size:15px}
#tippen input:focus{outline:none;border-color:rgba(0,229,255,.5)}
#tippen button{background:rgba(255,255,255,.09);border:none;border-radius:11px;
  color:var(--schrift);padding:0 18px;font-size:15px;font-weight:600}

/* --- Anmeldung ------------------------------------------------------ */
#tor{position:fixed;inset:0;background:var(--grund);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:16px;
  padding:24px;z-index:20;text-align:center}
#tor h1{font-size:15px;letter-spacing:.3em;text-transform:uppercase;
  font-weight:400;opacity:.6;margin:0}
#tor input{width:min(100%,340px);background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.14);border-radius:11px;padding:13px 15px;
  color:var(--schrift);font-size:15px;text-align:center}
#tor button{background:#00e5ff;color:#04080f;border:none;border-radius:11px;
  padding:13px 30px;font:600 15px/1 "Segoe UI",system-ui,sans-serif}
#tor .hinweis{font-size:12px;opacity:.5;max-width:340px;line-height:1.6}
#tor.weg{display:none}

/* --- Hochkant: untereinander statt nebeneinander -------------------
   Am Rechner ist rechts neben dem Ring Platz, und dort standen die
   Kacheln schon in hud.py. Auf einem hochkant gehaltenen Handy gibt es
   diesen Platz nicht: Gemessen verdeckten sie den halben Werkzeugkranz
   (Telegram, Websuche, Gedaechtnis waren nicht mehr zu sehen).

   Also teilt sich die Buehne dort: Ring oben, Kacheln darunter, und
   wenn es mehr werden, als hineinpassen, scrollt der Kachelbereich --
   der Ring bleibt stehen. Er ist das, worauf man schaut. */
@media (max-width:700px){
  #buehne{display:flex;flex-direction:column}
  #ring{position:relative;flex:1 1 auto;min-height:0}
  #kacheln{position:relative;top:auto;right:auto;width:auto;
    flex:0 1 auto;max-height:44%;overflow-y:auto;padding:0 12px 4px;
    /* Wieder anklickbar wird hier nichts: pointer-events bleibt none,
       nur Scrollen ist erlaubt. Siehe die Begruendung oben. */
    pointer-events:auto;touch-action:pan-y}
  #kacheln .kachel{pointer-events:none}
  /* Hochkant reiht sich das Angebot mit ein, statt ueber dem
     Untertitel zu schweben -- dort verdeckte es ihn. */
  #seite{position:relative;left:auto;bottom:auto;max-width:none;
    margin:6px 12px 0;flex:0 0 auto}
  #untertitel{position:relative;bottom:auto;flex:0 0 auto;
    padding:6px 8% 2px}

  /* Die Seiten-Leiste in den Fluss statt darueber. Am Rechner schwebt
     sie unten links ueber freier Flaeche; hochkant gibt es die nicht --
     gemessen lag sie mitten auf der zweiten Kachel und verdeckte deren
     Ueberschrift. */
  #seite{position:relative;left:auto;bottom:auto;max-width:none;
    margin:0 12px 6px;flex:0 0 auto}
}
</style>
</head>
<body>

<div id="tor">
  <h1>Sarvis</h1>
  <input id="schluessel" type="password" placeholder="Geräteschlüssel" autocomplete="current-password">
  <button id="anmelden">Verbinden</button>
  <p class="hinweis" id="torhinweis">Der Schlüssel wird nur auf diesem Gerät
    gespeichert und geht nie über die Adresszeile.</p>
</div>

<div id="kopf">
  <span id="ampel"></span><span id="lage">nicht verbunden</span>
  <span id="geraet"></span>
</div>

<div id="buehne">
  <canvas id="ring"></canvas>
  <div id="hintergrund"><div class="kopf"></div></div>
  <div id="kacheln"></div>
  <div id="seite">
    <div class="was"><div class="ort"></div><div class="dazu"></div></div>
    <a class="auf" target="_blank" rel="noopener noreferrer">Öffnen</a>
  </div>
  <div id="untertitel"></div>
</div>

<div id="bedienung">
  <button id="reden" disabled>Halten zum Reden</button>
  <label id="mithoeren" title="Mikrofon dauerhaft offen halten">
    <input type="checkbox" id="horchen"> „Hey Sarvis" mithören
  </label>
  <select id="mikro" title="Mikrofon"></select>
  <form id="tippen">
    <input id="zeile" placeholder="… oder tippen" autocomplete="off"
           enterkeyhint="send">
    <button type="submit">Los</button>
  </form>
</div>

<script src="/dabei/sarvis.js"></script>
</body>
</html>
