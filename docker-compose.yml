# Sarvis auf dem Server.
#
#   docker compose build          bauen
#   docker compose up -d          starten
#   docker compose logs -f        zusehen
#   docker compose run --rm sarvis bash    hineinschauen, ohne den
#                                          Dienst anzufassen

services:
  sarvis:
    build:
      context: .
      args:
        # Damit die uid im Image zu der auf dem Host passt -- sonst
        # gehoert alles, was Sarvis schreibt, jemand anderem.
        UID: "1000"
        GID: "1000"
    image: sarvis:latest
    container_name: sarvis
    command: python -m sarvis.main
    user: "1000:1000"
    working_dir: /srv/storage/projects/sarvis
    init: true

    # WARUM HOST-NETZ UND KEINE PORT-ABBILDUNG
    #
    # netz/server.py bindet fest auf 127.0.0.1:8900, mit Begruendung:
    # nach aussen soll ausschliesslich Caddy fuehren. Im Bruecken-Netz
    # waere das aber die Loopback-Adresse DES CONTAINERS -- eine
    # Abbildung "127.0.0.1:8900:8900" liefe ins Leere, denn abgebildet
    # wird nur, was auf 0.0.0.0 lauscht. Der Dienst waere gestartet und
    # trotzdem nicht erreichbar, ohne Fehlermeldung auf beiden Seiten.
    #
    # Mit dem Host-Netz ist das 127.0.0.1 des Containers das des
    # Servers. Damit gilt genau das, was gefordert war: 8900 nur auf
    # Loopback, davor Caddy -- und server.py bleibt unberuehrt.
    #
    # Nebenwirkung, hier erwuenscht: Ollama auf 11434 ist direkt
    # erreichbar, host.docker.internal wird nicht gebraucht.
    network_mode: host

    # Sarvis' Zugang zum Kopf. Eine eigene Datei und nicht hier
    # eingetragen: Diese Datei liegt im Repository, das Token darf das
    # nicht. Sie steht in /srv/data/sarvis, wird also mitgesichert und
    # ueberlebt jeden Neubau -- wie alles andere, was Sarvis gehoert.
    #
    # `claude setup-token` SPEICHERT nichts, es zeigt das Token nur an
    # (am 31.08.2026 einmal andersherum verstanden und deshalb hier
    # notiert). Wer es verliert, holt sich mit demselben Befehl ein
    # neues und traegt es dort ein.
    env_file:
      - /srv/data/sarvis/claude.env

    environment:
      # --- Betriebsart ---
      # "netz" statt "lokal": Auf dem Server gibt es kein Mikrofon, keine
      # Lautsprecher und keinen Bildschirm. Sarvis bekommt Sprache
      # geschickt und schickt seine Antwort zurueck.
      #
      # Das entscheidet mehr als es aussieht: Bei "lokal" laedt main.py
      # pynput (braucht X11), audio.py sounddevice (braucht ein
      # Audiogeraet) und startet das Qt-Overlay -- alle drei scheitern
      # hier schon beim IMPORT, nicht erst beim Benutzen.
      SARVIS_KLANG: netz

      # --- Orte (orte.py liest sie) ---
      SARVIS_DATEN: /srv/data/sarvis
      SARVIS_PRIVAT: /home/server3070
      SARVIS_ARBEIT: /srv/storage/projects

      # Modelle von Whisper landen hier, nicht im Image.
      HF_HOME: /srv/data/sarvis/modelle/hf
      XDG_CACHE_HOME: /srv/data/sarvis/cache

      # HyperFrames: Chrome aus dem Image statt eines eigenen Downloads,
      # keine Telemetrie, keine automatisch installierten Skills (die
      # stehen im Handbuch).
      HYPERFRAMES_BROWSER_PATH: /usr/bin/google-chrome
      HYPERFRAMES_NO_TELEMETRY: "1"
      HYPERFRAMES_SKIP_SKILLS: "1"
      DO_NOT_TRACK: "1"

      # Der Verlauf, den das SDK schreibt. Ausgeschrieben statt aus
      # WURZEL gerechnet, damit ein Umzug des Quelltextes ihn nicht
      # still verliert (orte.py, VERLAUF_ORDNER).
      SARVIS_VERLAUF: /srv/data/sarvis/home/.claude/projects/-srv-storage-projects-sarvis

      # --- Git ---
      # Steht auch im Image (git config --system). Hier noch einmal,
      # weil es der Knopf ist, an dem man dreht -- und weil die
      # Umgebungsvariablen die Datei uebersteuern, nicht umgekehrt.
      GIT_AUTHOR_NAME: Sarvis
      GIT_AUTHOR_EMAIL: sarvis@tech-artist.de
      GIT_COMMITTER_NAME: Sarvis
      GIT_COMMITTER_EMAIL: sarvis@tech-artist.de

      # HOME LIEGT AUF DER DATENPLATTE, NICHT IM CONTAINER.
      #
      # Vorher war es /home/sarvis aus dem Dockerfile, und nur der
      # Unterordner .claude war herausgemountet. Damit lag .claude.json
      # -- Kontobindung, machineID, und vor allem der Vermerk, dass
      # /srv/storage/projects/sarvis ein vertrauter Ordner ist -- IM
      # Container. Ein `up --force-recreate` hat sie am 31.08.2026
      # ersatzlos mitgenommen.
      #
      # Das faellt nicht als Fehler auf. Es faellt als Schweigen auf:
      # Ohne den Vertrauensvermerk wartet die CLI auf eine Rueckfrage,
      # die im Dienst niemand beantwortet -- der Container laeuft, und
      # Sarvis sagt nichts. Derselbe Fallstrick hatte schon den
      # Telegram-Abholer erwischt.
      #
      # Jetzt liegt das ganze HOME unter /srv/data/sarvis, das ohnehin
      # als ganzer Ordner durchgereicht wird. Ein Neubau kann ihm
      # dort nichts mehr wegnehmen, und es braucht keinen weiteren
      # Mount -- schon gar keinen auf eine einzelne Datei.
      HOME: /srv/data/sarvis/home
      TZ: Europe/Berlin
      PYTHONUNBUFFERED: "1"

    volumes:
      # Der Quelltext. Gleicher Pfad wie auf dem Host -- siehe die lange
      # Begruendung im Dockerfile (schutz.py und der Verlauf-Slug).
      # Liegt ueber der Kopie aus dem Image, damit eine Aenderung wirkt,
      # ohne neu zu bauen.
      - /srv/storage/projects:/srv/storage/projects

      # Der Benutzerordner als "privat"-Projektort. Ebenfalls gleicher
      # Pfad, aus demselben Grund.
      - /home/server3070:/home/server3070

      # Alles, was Sarvis mitbringt und erzeugt: Gedaechtnis, Timer,
      # Auftragsjournal, Zugaenge, Stimmen, Modelle.
      - /srv/data/sarvis:/srv/data/sarvis

      # Werkstatt der Arbeiter (13.11.2026): Blender vom Host und das
      # Handbuch (Design-Stil, Blender-, HyperFrames-Anleitung). Beides
      # nur lesend -- der Arbeiter darf es benutzen, nicht veraendern.
      - /home/server3070/tools/blender-4.5.13-linux-x64:/opt/blender:ro
      - /srv/data/sarvis-handbuch:/opt/handbuch:ro

      # Die Anmeldung der Claude-Code-CLI. Kommt von aussen (einmalig
      # `docker compose run --rm sarvis claude` und dann anmelden) und
      # muss einen Neubau ueberleben.
      #
      # Sarvis' eigener Ordner -- Sitzungsverlauf, Einstellungen,
      # Projekte -- liegt seit dem 31.08.2026 unter
      # /srv/data/sarvis/home/.claude und kommt damit schon durch den
      # Mount darueber mit. Bewusst NICHT Saschas Ordner: Sein Verlauf
      # geht Sarvis nichts an, und umgekehrt.

      # DIE ANMELDUNG WIRD NICHT MEHR GETEILT.
      #
      # Hier stand einmal ein Bind-Mount auf Saschas
      # .credentials.json -- "geteilt statt kopiert", damit ein
      # erneuertes Token bei beiden ankommt. Der Gedanke war richtig,
      # die Umsetzung nicht: Ein Bind-Mount haengt am Inode, nicht am
      # Namen. Die CLI erneuert aber, indem sie die Datei ERSETZT
      # (schreiben + umbenennen). In dem Moment zeigt der Host auf die
      # neue Datei und der Container weiter auf die alte -- geteilt war
      # danach gar nichts mehr, und keiner der beiden hat es gemerkt.
      #
      # Am 31.08.2026 gemessen: Host-Inode 1320965 (509 Bytes),
      # Container-Inode 1320968 (281 Bytes). Sarvis' Kopie enthielt
      # accessToken "" und refreshToken "" -- er hatte mit einem
      # bereits eingeloesten Refresh-Token erneuert, war gescheitert
      # und hatte sich dabei selbst ausgesperrt. Von da an konnte sich
      # nichts mehr erneuern: es war nichts mehr da, womit.
      #
      # Deshalb jetzt ein EIGENER Zugang. Die Anmeldung liegt in
      # /srv/data/sarvis/home/.claude/.credentials.json und kommt ueber
      # den Ordner-Mount /srv/data/sarvis mit -- ein Ordner, dem ein
      # Umbenennen DARIN nichts anhaben kann. Zwei eigenstaendige
      # Sitzungen mit je eigenem Refresh-Token kommen sich nicht in die
      # Quere; nur zwei Halter DESSELBEN Tokens tun das.
      #
      # Einmalig anmelden (und nach einem Abmelden erneut), so wie
      # anmeldung.py es beim Start auch ansagt:
      #   docker compose exec sarvis claude setup-token
      #   danach: docker compose restart sarvis

      # Nur lesen: die Zeitzone des Servers.
      - /etc/localtime:/etc/localtime:ro

    # Die Grafikkarte. Wie beim Transkript-Dienst -- der nvidia-Treiber
    # wird eingehaengt, nichts davon steckt im Image.
    #
    # ACHTUNG, die Karte ist knapp: 8 GB, und Ollama belegt mit
    # qwen3.5:9b davon rund 5,6 GB. large-v3-turbo mit
    # compute_type="int8_float16" braucht gemessen 1.297 MiB -- das
    # passt, aber nicht zweimal. Wer hier ein groesseres Whisper-Modell
    # einstellt, nimmt es Ollama weg.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    restart: unless-stopped
